spring.application.name=api-rest
server.port=8080

spring.datasource.url=jdbc:h2:mem:apirest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# create-drop: recria o schema a cada start a partir das entidades.
# Serve para aprendizado; em produção usaríamos migrations (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=create-drop

# Precisa ser true para o data.sql rodar DEPOIS que o Hibernate cria as tabelas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
